<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GRC Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;650;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="scrim" id="scrim"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand-mark"><span class="dot"></span>SAP&nbsp;·&nbsp;SECURITY&nbsp;&amp;&nbsp;GRC</div>
      <h1 class="site-title" id="siteTitle">GRC Notes</h1>
      <p class="site-subtitle" id="siteSubtitle">Field reference</p>
    </div>
    <nav class="sidebar-nav" id="sidebarNav">
      <!-- populated by js/app.js from data/topics.json -->
    </nav>
    <div class="sidebar-foot">
      New topic? Add a PDF to <code>assets/pdfs/</code> and one entry to <code>data/topics.json</code>.
    </div>
  </aside>

  <div style="flex:1; min-width:0;">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar-title" id="topbarTitle">Overview</div>
    </div>

    <main class="main" id="main">
      <!-- populated by js/app.js -->
    </main>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
